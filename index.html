<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>00:00</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <style>
    body {
        overflow: hidden !important; /* Prevent scrollbars */
    }
    #clock-display {
        font-size: min(37vw, 80vh);
        line-height: 0.8; /* Tighter line height for large text */
        min-width: 0;
        min-height: 0;
    }
    #colon {
      margin-inline: -0.1em;
    }
    div:has(#second) {
        font-size: 0.5em;
        line-height: 0.5;
    }
    </style>
</head>
<body class="container-fluid d-flex justify-content-center align-items-center vh-100 text-body fw-bold font-monospace" data-bs-theme="dark">
    <time id="clock-display" class="d-flex flex-column-reverse mx-auto" style="align-items:flex-end;">
      <div class="d-flex">
        <span id="hour">00</span>
        <span id="colon">:</span>
        <span id="minute">00</span>
      </div>
      <div class="text-end">
        <span id="second" class="text-body-tertiary">00</span>
      </div>
    </time>
  <script type="text/javascript">
// https://github.com/uxitten/polyfill/blob/master/string.polyfill.js
// https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/String/padStart
if (!String.prototype.padStart) {
    String.prototype.padStart = function padStart(targetLength,padString) {
        targetLength = targetLength>>0; //truncate if number or convert non-number to 0;
        padString = String((typeof padString !== 'undefined' ? padString : ' '));
        if (this.length > targetLength) {
            return String(this);
        }
        else {
            targetLength = targetLength-this.length;
            if (targetLength > padString.length) {
                padString += padString.repeat(targetLength/padString.length); //append to original to ensure we are longer than needed
            }
            return padString.slice(0,targetLength) + String(this);
        }
    };
}

function setClock() {
  var now = new Date();

  var hour = now.getHours().toString().padStart(2, '0');
  var minute = now.getMinutes().toString().padStart(2, '0');
  var second = now.getSeconds().toString().padStart(2, '0');
  var isOddSecond = second % 2 != 0;

  document.querySelector('#hour').textContent = hour;
  document.querySelector('#minute').textContent = minute;
  document.querySelector('#second').textContent = second;
  var colonClasslist = document.querySelector('#colon').classList;
  isOddSecond ? colonClasslist.add('invisible') : colonClasslist.remove('invisible');

  var clockDisplayElement = document.querySelector('#clock-display'); // Query for the new ID
  clockDisplayElement.setAttribute('dateTime', `${hour}:${minute}:${second}`);
  document.title = `${hour}:${minute}`;
}

document.addEventListener('DOMContentLoaded', function onDomContentLoaded() {
  setClock();
  setInterval(setClock, 1000);
});
  </script>
    <script>
      // Cookie helper functions
      function setCookie(name, value, days) {
        let expires = "";
        if (days) {
          const date = new Date();
          date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
          expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + (value || "") + expires + "; path=/";
      }

      function getCookie(name) {
        const nameEQ = name + "=";
        const ca = document.cookie.split(';');
        for (let i = 0; i < ca.length; i++) {
          let c = ca[i];
          while (c.charAt(0) === ' ') c = c.substring(1, c.length);
          if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
        }
        return null;
      }

      // Declare currentState, to be determined by cookie or OS preference
      let currentState;

      // Select the body element
      const body = document.querySelector('body');
      // Get a reference to the time element
      const time = document.getElementById('clock-display');

      // --- Initial State Determination ---
      const currentStateFromCookie = getCookie("clockState");
      let validCookieState = false;

      if (currentStateFromCookie !== null) {
        const parsedState = parseInt(currentStateFromCookie, 10);
        if (!isNaN(parsedState) && parsedState >= 0 && parsedState <= 3) {
          currentState = parsedState;
          validCookieState = true;
          console.log('Loaded initial state from cookie:', currentState);
        }
      }

      if (!validCookieState) {
        const prefersDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        console.log('OS prefers dark mode:', prefersDarkMode);
        if (prefersDarkMode) {
          currentState = 0; // Dark theme, flex-column-reverse
          console.log('Setting initial state based on OS dark mode preference:', currentState);
        } else {
          currentState = 3; // Light theme, flex-column-reverse
          console.log('Setting initial state based on OS light mode preference:', currentState);
        }
      }

      // Fallback default if no cookie and OS preference logic didn't set it (should not happen with current logic)
      if (typeof currentState === 'undefined') {
          currentState = 0;
          console.log('Setting initial state to ultimate default:', currentState);
      }

      // --- Apply Initial Theme and Layout ---
      function applyStateStyles(state) {
        switch (state) {
          case 0: // Dark theme, flex-column-reverse
            body.dataset.bsTheme = "dark";
            time.classList.remove("flex-column");
            time.classList.add("flex-column-reverse");
            break;
          case 1: // Dark theme, flex-column
            body.dataset.bsTheme = "dark";
            time.classList.remove("flex-column-reverse");
            time.classList.add("flex-column");
            break;
          case 2: // Light theme, flex-column
            body.dataset.bsTheme = "light";
            time.classList.remove("flex-column-reverse");
            time.classList.add("flex-column");
            break;
          case 3: // Light theme, flex-column-reverse
            body.dataset.bsTheme = "light";
            time.classList.remove("flex-column");
            time.classList.add("flex-column-reverse");
            break;
        }
      }

      applyStateStyles(currentState); // Apply styles for the initial state

      // Add event listener for click events
      body.addEventListener('click', () => {
        // Increment currentState
        currentState++;

        // Reset currentState if it exceeds 3
        if (currentState > 3) {
          currentState = 0;
        }

        // Save current state to cookie
        setCookie("clockState", currentState, 30);

        // Apply styles based on the new state
        applyStateStyles(currentState);
      });
    </script>
</body>
</html>
